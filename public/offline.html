<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Offline — Chaiwala</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f9fa;
      color: #111;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }

    .icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #e9ecef;
      border: 1px solid #dee2e6;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
    }

    svg {
      display: block;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #111;
    }

    p {
      font-size: 0.875rem;
      color: #6c757d;
      max-width: 260px;
      line-height: 1.5;
      margin: 0 auto 1.75rem;
    }

    button {
      height: 42px;
      padding: 0 1.75rem;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font-size: 0.875rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      letter-spacing: 0.01em;
    }

    button:active {
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <div class="icon-wrap">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#6c757d" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round">
      <line x1="2" y1="2" x2="22" y2="22" />
      <path d="M8.5 16.5a5 5 0 0 1 7 0" />
      <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
      <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
      <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
      <path d="M5 13a10 10 0 0 1 5.24-2.76" />
      <line x1="12" y1="20" x2="12.01" y2="20" />
    </svg>
  </div>
  <h1>No internet connection</h1>
  <p>Internet nahi hai. Net connection check karein aur dobara try karein.</p>
  <button onclick="window.location.href='/'">Retry</button>
</body>

</html>
